{% extends "base.html" %}
{% load i18n %}
{% block content %}
    <div class="training-tasks-container">
        <div class="page-header">
            <h1>{% trans "Delete Question" %}</h1>
        </div>
        <p>
            {% trans "Are you sure you want to delete question:" %} <strong>{{ question.text|truncatewords:15 }}</strong>?
        </p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">{% trans "Delete" %}</button>
            <a href="{% url 'quizes:question_list' quiz_pk=question.quiz.pk %}"
               class="btn btn-secondary">{% trans "Cancel" %}</a>
        </form>
    </div>
{% endblock %}
